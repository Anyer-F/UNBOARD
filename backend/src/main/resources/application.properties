spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/unbound
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: esquema reproducible desde db/migration (V1..V5).
# baseline-on-migrate permite arrancar sobre una BD ya creada
# (la marca en V1 y aplica V2..V5); en una BD vacía corre V1..V5.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Upload and multipart configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads

# Firebase Configuration
firebase.service-account=serviceAccountKey.json
