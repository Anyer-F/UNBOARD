# Reverse proxy + hosting estático de la app UNBOUND.
#
# - HTTP (80)  -> redirige a HTTPS
# - HTTPS (443)-> archivos estaticos de Flutter + /api al backend
#
# Para producción reemplazar deploy/web/certs/ por certificados reales
# (Let's Encrypt via certbot, o montar /etc/letsencrypt).

# Tamaño maximo de uploads (coincide con spring.servlet.multipart)
client_max_body_size 25m;

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /usr/share/nginx/html;
    index index.html;

    # API: proxy al servicio backend
    location /api {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos estaticos + fallback SPA (rutas de Flutter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
